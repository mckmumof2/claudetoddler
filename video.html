<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VideoPortal — Watch</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <nav class="nav">
    <a href="index.html" class="nav-logo">
      <svg viewBox="0 0 24 24" style="width:28px;height:28px;fill:var(--primary)"><path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 1.99-.9 1.99-2L23 5c0-1.1-.9-2-2-2zm0 14H3V5h18v12zm-5-6l-7 4V7z"/></svg>
      VideoPortal
    </a>
    <div class="search-bar">
      <input id="searchInput" type="text" placeholder="Search videos, channels, topics…" autocomplete="off">
      <button id="searchBtn" aria-label="Search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      </button>
    </div>
    <div class="nav-actions">
      <a href="index.html" class="btn btn-outline">Browse</a>
    </div>
  </nav>

  <div class="player-layout">

    <!-- Main column -->
    <div class="player-main">
      <div class="video-player-wrap" id="playerWrap"></div>

      <div class="player-info">
        <h1 class="player-title" id="playerTitle"></h1>

        <div class="player-meta-row">
          <div class="player-stats">
            <span id="playerViews"></span>
            <span id="playerDate"></span>
          </div>
          <div class="player-actions">
            <button class="action-btn" id="playerLikeBtn"></button>
            <button class="action-btn" id="shareBtn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"/></svg>
              Share
            </button>
            <button class="action-btn" onclick="showToast('Added to Watch Later')">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67V7z"/></svg>
              Save
            </button>
          </div>
        </div>

        <div class="channel-row">
          <div class="channel-info">
            <div class="channel-avatar" id="channelAvatar"></div>
            <div>
              <div class="channel-name" id="channelName"></div>
              <div class="channel-subs" id="channelSubs"></div>
            </div>
          </div>
          <button class="btn-subscribe" id="subscribeBtn">Subscribe</button>
        </div>

        <div class="description" id="descriptionEl"></div>
      </div>
    </div>

    <!-- Sidebar -->
    <aside>
      <div class="sidebar-title">Up Next</div>
      <div class="sidebar-list" id="sidebarList"></div>
    </aside>

  </div>

  <footer class="footer">
    &copy; 2026 VideoPortal &mdash; Watch. Learn. Create.
  </footer>

  <div id="toast" class="toast"></div>

  <script src="js/data.js"></script>
  <script src="js/player.js"></script>

</body>
</html>
